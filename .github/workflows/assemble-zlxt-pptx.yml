name: Build merged ZLXT presentation

on:
  push:
    branches: [main]
    paths:
      - 'build/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PowerPoint composition tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-pptx pptxcompose

      - name: Download the two source decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/build"
          curl -L --fail --retry 4 --retry-all-errors \
            'https://assets.api.gamma.app/export/pptx/bloe92wo5bo2wyu/0aaf3605adb6c787470366015f21d3c0/bloe92wo5bo2wyu.pptx' \
            -o "$PWD/build/part-01.pptx"
          curl -L --fail --retry 4 --retry-all-errors \
            'https://assets.api.gamma.app/export/pptx/cvsevlj4ws3717k/e8bdaedc8e6b64ffed32967df546c082/cvsevlj4ws3717k.pptx' \
            -o "$PWD/build/part-02.pptx"
          unzip -t "$PWD/build/part-01.pptx" >/dev/null
          unzip -t "$PWD/build/part-02.pptx" >/dev/null

      - name: Merge the two decks using native PowerPoint structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptxcompose.compose import Composer

          first_path = Path('build/part-01.pptx')
          second_path = Path('build/part-02.pptx')
          output_path = Path('ZLXT_Canva_Merged_20_Slides.pptx')

          first = Presentation(first_path)
          second = Presentation(second_path)
          if len(first.slides) != 10 or len(second.slides) != 10:
              raise RuntimeError(
                  f'Expected 10+10 source slides, got {len(first.slides)}+{len(second.slides)}'
              )

          composer = Composer(first)
          composer.append(second)
          composer.save(output_path)

          merged = Presentation(output_path)
          if len(merged.slides) != 20:
              raise RuntimeError(f'Expected 20 merged slides, got {len(merged.slides)}')

          print(
              f'Created {output_path} with {len(merged.slides)} slides '
              f'and {output_path.stat().st_size} bytes'
          )
          PY
          unzip -t ZLXT_Canva_Merged_20_Slides.pptx >/dev/null

      - name: Commit the merged presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ZLXT_Canva_Merged_20_Slides.pptx
          if git diff --cached --quiet; then
            echo 'Presentation is already up to date.'
            exit 0
          fi
          git commit -m 'Add merged 20-slide ZLXT presentation'
          git push
