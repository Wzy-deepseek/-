name: Build merged ZLXT presentation

on:
  push:
    branches: [main]
    paths:
      - 'build/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install presentation tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-common fonts-noto-cjk
          python -m pip install --disable-pip-version-check python-pptx pymupdf pillow

      - name: Download the two source decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/build"
          curl -L --fail --retry 4 --retry-all-errors \
            'https://assets.api.gamma.app/export/pptx/bloe92wo5bo2wyu/0aaf3605adb6c787470366015f21d3c0/bloe92wo5bo2wyu.pptx' \
            -o "$PWD/build/part-01.pptx"
          curl -L --fail --retry 4 --retry-all-errors \
            'https://assets.api.gamma.app/export/pptx/cvsevlj4ws3717k/e8bdaedc8e6b64ffed32967df546c082/cvsevlj4ws3717k.pptx' \
            -o "$PWD/build/part-02.pptx"
          unzip -t "$PWD/build/part-01.pptx" >/dev/null
          unzip -t "$PWD/build/part-02.pptx" >/dev/null

      - name: Render both decks and create one 20-slide PPTX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/build/pdf" "$PWD/build/rendered"
          soffice -env:UserInstallation=file:///tmp/lo-profile-1 --headless \
            --convert-to pdf --outdir "$PWD/build/pdf" "$PWD/build/part-01.pptx"
          soffice -env:UserInstallation=file:///tmp/lo-profile-2 --headless \
            --convert-to pdf --outdir "$PWD/build/pdf" "$PWD/build/part-02.pptx"
          test -f "$PWD/build/pdf/part-01.pdf"
          test -f "$PWD/build/pdf/part-02.pdf"
          python - <<'PY'
          from pathlib import Path
          import io
          import pymupdf
          from PIL import Image
          from pptx import Presentation
          from pptx.util import Inches

          pdfs = [Path('build/pdf/part-01.pdf'), Path('build/pdf/part-02.pdf')]
          prs = Presentation()
          prs.slide_width = Inches(13.333333)
          prs.slide_height = Inches(7.5)
          blank = prs.slide_layouts[6]
          count = 0

          for pdf_path in pdfs:
              doc = pymupdf.open(pdf_path)
              for page in doc:
                  pix = page.get_pixmap(matrix=pymupdf.Matrix(2.0, 2.0), alpha=False)
                  image = Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
                  output = Path('build/rendered') / f'slide-{count + 1:02d}.jpg'
                  image.save(output, 'JPEG', quality=88, optimize=True, progressive=True, subsampling=1)
                  slide = prs.slides.add_slide(blank)
                  slide.shapes.add_picture(str(output), 0, 0, width=prs.slide_width, height=prs.slide_height)
                  count += 1

          if count != 20:
              raise RuntimeError(f'Expected 20 slides, got {count}')

          output = Path('ZLXT_Canva_Merged_20_Slides.pptx')
          prs.save(output)
          print(f'Created {output} with {count} slides and {output.stat().st_size} bytes')
          PY
          unzip -t ZLXT_Canva_Merged_20_Slides.pptx >/dev/null
          python - <<'PY'
          from pptx import Presentation
          prs = Presentation('ZLXT_Canva_Merged_20_Slides.pptx')
          assert len(prs.slides) == 20, len(prs.slides)
          print('Verified 20 slides')
          PY

      - name: Commit the merged presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ZLXT_Canva_Merged_20_Slides.pptx
          if git diff --cached --quiet; then
            echo 'Presentation is already up to date.'
            exit 0
          fi
          git commit -m 'Add merged 20-slide ZLXT presentation'
          git push
